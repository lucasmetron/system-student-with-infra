services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: educacore-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_PATH=/app/data/educacore.sqlite
      - NODE_ENV=production
    volumes:
      - ./backend/data:/app/data
    networks:
      - educacore-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: educacore-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - educacore-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  educacore-network:
    driver: bridge
