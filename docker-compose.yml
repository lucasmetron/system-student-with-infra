services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: educacore-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_PATH=/app/data/educacore.sqlite
    volumes:
      - ./backend/data:/app/data
    networks:
      - educacore-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: educacore-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - educacore-network

networks:
  educacore-network:
    driver: bridge
